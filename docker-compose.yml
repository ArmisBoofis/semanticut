# semanticut — local stack: db + api + web (Next.js).
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: semanticut-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semanticut-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      VIDEO_STORAGE_ROOT: ${VIDEO_STORAGE_ROOT:-/data/videos}
    volumes:
      - ${VIDEO_STORAGE_HOST_PATH:-./data/videos}:/data/videos
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semanticut-worker
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      VIDEO_STORAGE_ROOT: ${VIDEO_STORAGE_ROOT:-/data/videos}
    volumes:
      - ${VIDEO_STORAGE_HOST_PATH:-./data/videos}:/data/videos:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semanticut-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
    name: semanticut_postgres_data
